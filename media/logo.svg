<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 4 Patitas: caras de la gata y el perro dibujadas a mano alzada (trazo de lápiz imperfecto)
       sobre un círculo pastel con lunares. El filtro "lapiz" deforma levemente el trazo. -->
  <defs>
    <filter id="lapiz" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lapiz2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
    <pattern id="lunares" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.2" fill="#FFFDF7"/>
      <circle cx="25" cy="25" r="4.2" fill="#FFFDF7"/>
    </pattern>
    <clipPath id="caraGata"><path d="M95 300 C92 250 120 224 175 224 C230 224 258 250 255 300 C252 350 220 378 175 378 C130 378 98 350 95 300 Z"/></clipPath>
  </defs>

  <!-- soporte gráfico: círculo pastel plano con lunares -->
  <circle cx="256" cy="262" r="236" fill="#F6E7A9"/>
  <circle cx="256" cy="262" r="236" fill="url(#lunares)" opacity=".75"/>

  <g stroke="#2A2723" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- GATA -->
    <g filter="url(#lapiz)" stroke-width="6">
      <path d="M108 268 L100 186 L156 228" fill="#FFFDF7"/>
      <path d="M196 228 L250 188 L246 270" fill="#FFFDF7"/>
      <path d="M95 300 C92 250 120 224 175 224 C230 224 258 250 255 300 C252 350 220 378 175 378 C130 378 98 350 95 300 Z" fill="#FFFDF7"/>
      <g clip-path="url(#caraGata)"><path d="M196 222 C230 220 262 240 260 276 C250 288 226 286 210 272 C198 262 192 244 196 222 Z" fill="#2A2723" stroke="none"/></g>
      <circle cx="143" cy="300" r="6.5" fill="#2A2723" stroke="none"/>
      <circle cx="207" cy="300" r="6.5" fill="#2A2723" stroke="none"/>
      <path d="M169 318 L181 318 L175 326 Z" fill="#2A2723"/>
      <path d="M160 332 Q167 341 175 332 Q183 341 190 332" stroke-width="4.5"/>
      <path d="M118 318 L78 310 M118 330 L76 334 M232 318 L272 310 M232 330 L274 334" stroke-width="4"/>
    </g>
    <circle cx="124" cy="330" r="14" fill="#F6E7A9" stroke="none"/>
    <circle cx="226" cy="330" r="14" fill="#F6E7A9" stroke="none"/>
    <!-- sombrero de paja de la gata -->
    <g filter="url(#lapiz)" stroke-width="5.5">
      <path d="M124 222 C124 182 146 164 174 164 C204 164 222 182 222 222" fill="#FFFDF7"/>
      <ellipse cx="172" cy="226" rx="94" ry="17" fill="#FFFDF7"/>
      <path d="M126 210 C156 202 192 202 220 210" stroke-width="7"/>
    </g>
    <path d="M100 228 L118 224 M132 232 L150 230 M196 230 L214 232 M226 228 L244 230" stroke-width="3" filter="url(#lapiz2)" opacity=".7"/>

    <!-- PERRO -->
    <g filter="url(#lapiz)" stroke-width="6">
      <path d="M272 300 C268 248 298 222 342 222 C386 222 416 248 412 300 C409 352 382 380 342 380 C302 380 275 352 272 300 Z" fill="#FFFDF7"/>
      <path d="M286 252 C260 254 248 292 254 332 C258 354 274 354 282 338 C288 312 292 282 294 262 Z" fill="#FFFDF7"/>
      <path d="M398 252 C424 254 436 292 430 332 C426 354 410 354 402 338 C396 312 392 282 390 262 Z" fill="#FFFDF7"/>
      <ellipse cx="342" cy="332" rx="34" ry="24" fill="#FFFDF7"/>
      <ellipse cx="342" cy="320" rx="11" ry="8" fill="#2A2723" stroke="none"/>
      <path d="M342 328 L342 338 M328 342 Q342 350 356 342" stroke-width="4.5"/>
      <circle cx="314" cy="292" r="6.5" fill="#2A2723" stroke="none"/>
      <circle cx="370" cy="292" r="6.5" fill="#2A2723" stroke="none"/>
    </g>
    <circle cx="300" cy="330" r="13" fill="#F6E7A9" stroke="none"/>
    <circle cx="384" cy="330" r="13" fill="#F6E7A9" stroke="none"/>
    <!-- sombrero de paja del perro -->
    <g filter="url(#lapiz)" stroke-width="5.5">
      <path d="M292 220 C292 178 316 160 344 160 C374 160 394 178 394 220" fill="#FFFDF7"/>
      <ellipse cx="342" cy="224" rx="100" ry="18" fill="#FFFDF7"/>
      <path d="M294 207 C326 199 362 199 392 207" stroke-width="7"/>
    </g>
    <path d="M262 226 L280 222 M296 230 L314 228 M370 228 L388 230 M402 226 L420 228" stroke-width="3" filter="url(#lapiz2)" opacity=".7"/>

    <!-- segunda pasada de lápiz, más tenue, como al repasar el dibujo -->
    <g filter="url(#lapiz2)" stroke-width="2.2" opacity=".35">
      <path d="M95 300 C92 250 120 224 175 224 C230 224 258 250 255 300 C252 350 220 378 175 378 C130 378 98 350 95 300 Z"/>
      <path d="M272 300 C268 248 298 222 342 222 C386 222 416 248 412 300 C409 352 382 380 342 380 C302 380 275 352 272 300 Z"/>
    </g>

    <!-- garabatos: corazón y destellos -->
    <g filter="url(#lapiz)" stroke-width="4.5">
      <path d="M258 140 C246 122 222 132 232 152 C238 164 258 176 258 176 C258 176 278 164 284 152 C294 132 270 122 258 140 Z" fill="#F6E7A9"/>
      <path d="M78 150 L78 176 M65 163 L91 163 M440 140 L440 162 M429 151 L451 151"/>
    </g>
  </g>
</svg>
