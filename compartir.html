/* =====================================================================
   4 PATITAS · estilos
   Concepto: app de vecinos con espíritu de cuaderno japonés (referencia
   general: Dokonoko). Amarillo de marca, tinta negra plana, mucho blanco,
   bordes grises finos, botones píldora y animales recortados en papel.
   Tema único claro, a propósito: el amarillo y el blanco son la marca.
   ===================================================================== */

.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{font-family:var(--f-body);font-weight:500;font-size:1rem;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip}
main{overflow-x:clip}
img,video{display:block;max-width:100%}
img{font-size:.8rem}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--yellow);color:var(--ink)}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-weight:800;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}

.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-hand);font-size:1.1rem;line-height:1.2;color:var(--ink-2)}
.eyebrow .ico{width:1.05em;height:1.05em}
.h-xl{font-size:clamp(2.3rem,6vw,4.4rem);letter-spacing:-.02em;line-height:1.15}
.h-lg{font-size:clamp(1.7rem,3.8vw,2.7rem)}
.h-md{font-size:clamp(1.3rem,2.4vw,1.8rem)}
.lead{font-size:clamp(1rem,1.3vw,1.12rem);color:var(--ink-2);max-width:56ch}
.hand{font-family:var(--f-hand);font-weight:400}
.mark{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .08em}
.muted{color:var(--muted)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mt{margin-top:20px}
.empty{padding:34px;text-align:center;color:var(--ink-2)}

/* ---------- botones (píldoras) ---------- */
.btn{--bg:var(--bg);--fg:var(--ink);--bd:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--bg);color:var(--fg);border:1.5px solid var(--bd);font-weight:700;font-size:.98rem;line-height:1.2;white-space:nowrap;transition:transform .2s ease,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn--primary{--bg:var(--ink);--fg:#FFFFFF}
.btn--alert{--bg:var(--yellow)}
.btn--straw{--bg:var(--yellow-2)}
.btn--ghost{--bd:var(--line-2)}
.btn--sm{padding:8px 15px;font-size:.88rem}
.btn:disabled{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:.86rem;white-space:nowrap;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 11px 2px 8px;border-radius:999px;font-size:.76rem;font-weight:800;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);white-space:nowrap}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* ---------- marca ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-hand);font-size:1.45rem;line-height:1;letter-spacing:.01em}
.brand__mark{width:42px;height:42px;border-radius:11px;flex-shrink:0;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.brand:hover .brand__mark{transform:rotate(-8deg) scale(1.05)}

/* ---------- barra superior amarilla ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:50;background:var(--yellow);border-bottom:1.5px solid rgba(28,27,25,.12);transition:transform .4s cubic-bezier(.7,0,.2,1)}
.nav.hide{transform:translateY(-100%)}
.nav__in{display:flex;align-items:center;justify-content:space-between;gap:14px;height:var(--nav-h)}
.nav__links{display:flex;gap:2px}
.nav__links a{padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem;white-space:nowrap;transition:background .2s}
.nav__links a:hover{background:rgba(255,255,255,.55)}
.nav__links a.active{background:var(--bg)}
.nav__end{display:flex;align-items:center;gap:8px}
.nav__cta{--bg:var(--bg)}
.nav__acct{display:flex;align-items:center;gap:8px;padding:3px 13px 3px 3px;border-radius:999px;font-weight:700;font-size:.92rem;background:rgba(255,255,255,.6);transition:.2s}
.nav__acct:hover,.nav__acct.active{background:var(--bg)}
.uavatar{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--ink);color:var(--yellow);font-weight:800;line-height:1}
.uavatar img{width:100%;height:100%;object-fit:cover}
.uavatar .ico{width:56%;height:56%;color:#FFFFFF}
.tabbar{display:none}

/* ---------- transición de página: telón amarillo con el logo ---------- */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;visibility:hidden;display:grid;place-items:center}
.curtain__panel{position:absolute;inset:0;background:var(--yellow);transform-origin:bottom}
.curtain__panel--2{background:var(--bg)}
.curtain__logo{position:relative;width:min(132px,34vw);border-radius:28px}
.curtain__word{position:absolute;bottom:22%;font-family:var(--f-hand);font-size:1.4rem}

/* ---------- portada: franja amarilla con la gata y el perro ---------- */
.hero{background:var(--yellow);padding-top:calc(var(--nav-h) + 26px);position:relative;overflow:hidden}
.hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:end}
.hero__copy{padding-bottom:clamp(36px,6vw,72px)}
.hero h1{margin:12px 0 18px}
.hero h1 .line{display:block;overflow:hidden;padding-bottom:.05em}
.hero h1 .line>span{display:inline-block}
.hero .lead{color:var(--ink)}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
.hero__cta .btn--alert{--bg:var(--ink);--fg:var(--yellow)}
.hero__proof{display:flex;align-items:center;gap:12px;font-size:.92rem}
.hero__art{position:relative;align-self:end;max-width:560px;justify-self:end;width:100%}
.hero__art img{width:100%;height:auto;display:block}
.bubble{position:absolute;background:var(--bg);border-radius:18px;padding:10px 14px;font-weight:700;font-size:.9rem;line-height:1.35;box-shadow:0 2px 0 rgba(28,27,25,.08);white-space:nowrap}
.bubble::after{content:'';position:absolute;bottom:-9px;left:var(--tail,24px);border:9px solid transparent;border-top-color:var(--bg);border-bottom:0}
.bubble small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.avatars{display:flex}
.avatars span{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2.5px solid var(--yellow);margin-left:-9px;background:var(--bg)}
.avatars span:first-child{margin:0}
.avatars img,.avatars video{width:100%;height:100%;object-fit:cover}

/* barra gris de sección (como "Local Neighborhoods") */
.bar{background:var(--soft);border-block:1px solid var(--line);padding:10px 0}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;font-size:.95rem}
.bar a{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:var(--ink-2)}
.bar a .ico{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--ink);color:#FFFFFF}
.stories{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:16px 2px 18px;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:76px;scroll-snap-align:start}
.story small{font-size:.8rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story__ring{width:72px;height:72px;border-radius:50%;padding:3px;background:var(--bg);box-shadow:0 0 0 1.5px var(--line);display:block;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.story__ring.lost{box-shadow:0 0 0 3px var(--red)}
.story__ring>*{width:100%;height:100%;border-radius:50%;object-fit:cover;overflow:hidden}
.story:hover .story__ring{transform:translateY(-3px)}
.story--add .story__ring{display:grid;place-items:center;background:var(--yellow);box-shadow:none}
.story--add .ico{width:28px;height:28px;stroke-width:2.2}

/* ---------- secciones ---------- */
.section{padding:clamp(64px,9vw,112px) 0;position:relative}
.section__head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px;flex-wrap:wrap}
.section__head h2{max-width:18ch;margin-top:6px}

.mission{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center}
.frame{border-radius:var(--r-lg);overflow:hidden;background:var(--soft);position:relative}
.frame video,.frame img{width:100%;height:100%;object-fit:cover}
.mission .frame{aspect-ratio:16/11}
.mission p{margin-top:14px}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:26px;position:relative;transition:border-color .2s,transform .25s}
.feature:hover{border-color:var(--ink);transform:translateY(-3px)}
.feature__ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c,var(--yellow));margin-bottom:16px}
.feature__ico .ico{width:28px;height:28px}
.feature h3{font-size:1.25rem;margin-bottom:6px}
.feature p{color:var(--ink-2);font-size:.95rem}
.feature--big{grid-column:span 2;display:grid;grid-template-columns:1fr 1.15fr;gap:22px;background:var(--yellow);border-color:var(--yellow)}
.feature--big p{color:var(--ink)}
.feature--big .mini-map{min-height:240px;border-radius:var(--r);overflow:hidden;background:var(--soft)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{padding:20px 22px;border-radius:var(--r-lg);background:var(--soft)}
.stat b{font-size:clamp(1.9rem,3.6vw,2.6rem);font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-weight:700;font-size:.88rem}

/* cómo funciona: cielo celeste con nubes y globos de diálogo */
.how{background:var(--sky);overflow:hidden;position:relative}
.how .cloud{position:absolute;pointer-events:none}
.cloud svg{width:100%;height:auto;fill:#FFFFFF}
.how__track{display:flex;gap:18px;padding:0 max(16px,calc((100vw - 1120px)/2));width:max-content;position:relative;z-index:1}
.how__intro{width:min(380px,80vw);flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.how__intro .eyebrow{color:var(--ink)}
.step{width:min(330px,78vw);flex-shrink:0;border-radius:var(--r-lg);padding:26px;background:var(--bg);display:flex;flex-direction:column;gap:10px;min-height:280px;position:relative}
.step::after{content:'';position:absolute;bottom:-12px;left:36px;border:12px solid transparent;border-top-color:var(--bg);border-bottom:0}
.step__n{display:inline-block;font-family:var(--f-hand);font-size:1rem;background:var(--c-l);border-radius:999px;padding:2px 12px;align-self:flex-start}
.step__art{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c-l);margin:4px 0 6px}
.step__art .ico{width:32px;height:32px}
.step h3{font-size:1.3rem}
.step p{color:var(--ink-2);font-size:.95rem}

/* tarjetas de mascota */
.pets-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 24px;margin:0 -16px;scrollbar-width:none}
.pets-rail::-webkit-scrollbar{display:none}
.pet-card{flex:0 0 min(250px,70vw);scroll-snap-align:start;border-radius:var(--r-lg);overflow:hidden;background:var(--bg);border:1.5px solid var(--line);transition:transform .25s,border-color .2s;position:relative;display:block}
.pet-card:hover{transform:translateY(-3px);border-color:var(--ink)}
.pet-card__media{aspect-ratio:1;position:relative;background:var(--accent,var(--yellow-2));overflow:hidden}
.pet-card__media video,.pet-card__media img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.pet-card:hover .pet-card__media img,.pet-card:hover .pet-card__media video{transform:scale(1.04)}
.media-blank{width:100%;height:100%;display:grid;place-items:center;color:var(--ink)}
.media-blank .ico{width:44%;height:44%;stroke-width:1.3}
.pet-card__badge{position:absolute;top:10px;left:10px}
.pet-card__body{padding:14px 16px 16px}
.pet-card__body h3{font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pet-card__body h3 small{font-size:.8rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.pet-card__body p{color:var(--muted);font-size:.86rem}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.traits span{font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft)}
.pets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pets-grid .pet-card{flex:none}
.pet-card--add{display:grid;place-items:center;min-height:320px;text-align:center;border-style:dashed;background:var(--soft)}
.pet-card--add .feature__ico{margin:0 auto 12px}

.identity{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(24px,5vw,60px);align-items:center}
.identity .frame{aspect-ratio:4/3}

/* comparativa */
.compare{border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.compare__row{display:grid;grid-template-columns:1.5fr .8fr .8fr;align-items:center;border-top:1px solid var(--line)}
.compare__row:first-child{border-top:0;font-weight:800;background:var(--soft)}
.compare__row>*{padding:14px 20px}
.compare__row>:nth-child(2){background:var(--yellow-2);text-align:center;align-self:stretch;display:grid;place-items:center}
.compare__row:first-child>:nth-child(2){background:var(--yellow)}
.compare__row>:nth-child(3){text-align:center;color:var(--muted);display:grid;place-items:center}
.compare .yes{color:var(--green)} .compare .no{color:var(--red)}
.compare .ico{width:24px;height:24px;stroke-width:2.4}

/* testimonios: globos de diálogo */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.quote{display:flex;flex-direction:column;gap:16px}
.quote p{background:var(--c);border-radius:var(--r-lg);padding:22px;font-weight:700;font-size:1.02rem;line-height:1.6;position:relative}
.quote p::after{content:'';position:absolute;bottom:-12px;left:30px;border:12px solid transparent;border-top-color:var(--c);border-bottom:0}
.quote footer{display:flex;align-items:center;gap:12px;font-size:.9rem;padding-left:14px}
.quote footer span{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}

/* preguntas */
.faq{display:grid;gap:8px;max-width:760px}
.faq details{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r)}
.faq details[open]{border-color:var(--ink)}
.faq summary{list-style:none;padding:16px 20px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:1.4rem;line-height:1;font-weight:700;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 20px 18px;color:var(--ink-2)}

/* llamado final */
.cta{border-radius:var(--r-lg);background:var(--yellow);padding:clamp(30px,5vw,56px) clamp(24px,5vw,56px) 0;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end;overflow:hidden}
.cta__copy{padding-bottom:clamp(30px,5vw,56px)}
.cta p{color:var(--ink);margin:12px 0 22px;max-width:46ch}
.cta__art img{width:100%;max-width:360px;margin-left:auto}

footer.foot{padding:56px 0 110px;border-top:1px solid var(--line);margin-top:70px}
.foot__grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:26px;color:var(--ink-2);font-size:.95rem}
.foot h4{font-size:.95rem;margin-bottom:8px;color:var(--ink)}
.foot a{display:block;padding:3px 0}
.foot a:hover{text-decoration:underline}

/* ---------- páginas internas ---------- */
.page{padding:calc(var(--nav-h) + 36px) 0 100px;min-height:100vh}
.page__head{margin-bottom:24px}
.page__head h1{margin:6px 0 10px}
.card{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,30px)}

/* mapa */
.mapwrap{display:grid;grid-template-columns:340px 1fr;gap:16px;height:calc(100vh - var(--nav-h) - 56px);min-height:560px}
.mapside{display:flex;flex-direction:column;gap:12px;min-height:0}
.mapside__list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.map{border-radius:var(--r-lg);overflow:hidden;position:relative;background:var(--soft);z-index:0;border:1.5px solid var(--line)}
.map__hint{position:absolute;z-index:500;left:50%;top:12px;transform:translateX(-50%);background:var(--yellow);padding:7px 16px;border-radius:999px;font-weight:800;font-size:.85rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.map__tools{position:absolute;z-index:500;right:12px;bottom:12px}
.alert-item{display:flex;gap:12px;padding:10px;border-radius:var(--r);background:var(--bg);border:1.5px solid var(--line);cursor:pointer;transition:.2s;text-align:left;width:100%}
.alert-item:hover,.alert-item.on{border-color:var(--ink)}
.alert-item h4{font-size:1rem}
.alert-item p{font-size:.8rem;color:var(--muted)}
.thumb{width:60px;height:60px;flex-shrink:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--c,var(--yellow-2))}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .media-blank .ico{width:56%;height:56%;stroke-width:1.6}
.tiles{filter:saturate(.85)}
.tiles-dark{filter:saturate(.8)}
/* pin: foto redonda con aro del color del estado */
.pin{width:46px;height:46px;border-radius:50%;background:var(--bg);border:3px solid var(--c);box-shadow:0 2px 0 rgba(28,27,25,.25);position:relative;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.pin::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.pin img,.pin .pin__ico{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--t)}
.pin svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pin.pulse{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.leaflet-marker-icon:hover .pin{transform:scale(1.12)}
.leaflet-container{font-family:var(--f-body)}
.leaflet-popup-content-wrapper{border-radius:var(--r);box-shadow:0 4px 0 rgba(28,27,25,.12);border:1.5px solid var(--line)}
.leaflet-popup-content{margin:12px 16px;color:var(--ink)}
.leaflet-bar{border:1.5px solid var(--line)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{color:var(--ink)!important}
.pop h4{font-size:1.02rem;margin-bottom:2px}
.pop p{margin:0!important;color:var(--ink-2);font-size:.8rem}
.pop button{margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:.8rem}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--sky-d);border:3px solid #FFFFFF;box-shadow:0 0 0 6px rgba(63,169,224,.25)}
.ring-label{font:800 10px/1 var(--f-body);color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;transform:translate(-50%,-50%);background:var(--bg);padding:3px 7px;border-radius:999px;display:inline-block}
.zone-label{font:700 11px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;transform:translate(-50%,-50%)}
.river-label{font:1.05rem/1 var(--f-hand);color:var(--sky-d);white-space:nowrap;transform:translate(-50%,-50%) rotate(-82deg);display:inline-block}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* formularios */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field--full{grid-column:1/-1}
.field label{font-weight:800;font-size:.88rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.input{width:100%;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);outline:none;transition:border-color .2s,background .2s}
.input:focus{border-color:var(--ink);background:var(--bg)}
.input::placeholder{color:var(--muted)}
textarea.input{resize:vertical;min-height:110px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.seg button{padding:12px 8px;border-radius:14px;background:var(--soft);border:1.5px solid transparent;font-weight:800;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;text-transform:capitalize}

.tile__info{position:absolute;inset:auto 0 0 0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(28,27,25,.62));color:#FFFFFF;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}

.tile__info small{display:flex;align-items:center;gap:3px;font-size:.76rem;font-weight:700;flex-shrink:0}

.byline-img{width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px;display:inline-block}
.post{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:.92rem}

    { id: 'p5', name: 'Tigre', species: 'gato', breed: 'Naranja', age: '5 años', owner: 'Familia Rojas', zone: 'Mutualista', video: 'media/v3.mp4', bio: 'Comelón profesional. Patrulla el mercado como si fuera el dueño.', traits: ['Callejero', 'Sociable'], followers: 970, accent: '#FF4D4D' },
    { id: 'p6', name: 'Toby', species: 'perro', breed: 'Jack Russell', age: '6 años', owner: 'Jorge P.', zone: 'Equipetrol', photo: P + 'toby.jpg', bio: 'Olfato de detective. Le teme a los cohetes de fin de año.', traits: ['Juguetón', 'Collar rojo'], followers: 640, accent: '#FFB020', lost: true },
    { id: 'p7', name: 'Coco', species: 'perro', breed: 'Dálmata', age: '3 años', owner: 'Lucía V.', zone: 'Urbarí', photo: P + 'coco.jpg', bio: 'Tiene 101 manchas (las contamos). Le encanta mirar la calle desde el balcón.', traits: ['Curiosa', 'Vacunada', 'Con chip'], followers: 3020, accent: '#1B1A2E' },
    { id: 'p8', name: 'Max', species: 'perro', breed: 'Yorkshire terrier', age: '4 años', owner: 'Paola G.', zone: 'Sirari', photo: P + 'max.jpg', bio: 'Pequeño en tamaño, gigante en actitud. Guardián oficial del condominio.', traits: ['Valiente', 'Peluquería al día'], followers: 1580, accent: '#FFB020' },
    { id: 'p9', name: 'Bruno', species: 'perro', breed: 'Pug', age: '5 años', owner: 'Rodrigo C.', zone: 'Centro', photo: P + 'bruno.jpg', bio: 'Ronca más fuerte que su dueño. Fan número uno del pollo broaster.', traits: ['Dormilón', 'Glotón'], followers: 2740, accent: '#FF6B35' },
    { id: 'p10', name: 'Kira', species: 'perro', breed: 'Border collie', age: '2 años', owner: 'Sofía M.', zone: 'Urubó', photo: P + 'kira.jpg', bio: 'La más rápida del parque. Atrapa frisbees y corazones.', traits: ['Atlética', 'Obediente', 'Con chip'], followers: 4210, accent: '#7B61FF' },
    { id: 'p11', name: 'Simón', species: 'conejo', breed: 'Holandés enano', age: '1 año', owner: 'Mateo F.', zone: 'Las Palmas', photo: P + 'simon.jpg', bio: 'Come zanahorias, salta de felicidad y muerde cables si no lo vigilas.', traits: ['Saltarín', 'Tierno'], followers: 990, accent: '#1DBF73' },
    { id: 'p12', name: 'Nala', species: 'gato', breed: 'Gata negra', age: '3 años', owner: 'Fernanda L.', zone: 'Hamacas', photo: P + 'nala.jpg', bio: 'Trae buena suerte, digan lo que digan. Ojos color miel.', traits: ['Misteriosa', 'Esterilizada'], followers: 1870, accent: '#1B1A2E' },
    { id: 'p13', name: 'Lucas', species: 'perro', breed: 'Mestizo', age: '2 años', owner: 'Familia Suárez', zone: 'Plan 3000', photo: P + 'lucas.jpg', bio: 'Rescatado de la calle gracias a 4 Patitas. Hoy es el payaso de la casa.', traits: ['Adoptada', 'Sociable'], followers: 3560, accent: '#FF4D4D' },
  ];

  // Versión liviana de un solo archivo (huellas-movil.html): los medios van incrustados en
  // window.HUELLAS_MEDIA y los dos videos grandes se reemplazan por fotos.
  const LITE = !!window.HUELLAS_LITE;
  const LITE_SWAP = { 'media/v0.mp4': 'media/img2.avif', 'media/v3.mp4': 'media/pets/atigrado.jpg' };
  const M = p => (p && window.HUELLAS_MEDIA && window.HUELLAS_MEDIA[p]) || p;
  const lite = list => {
    if (LITE) list.forEach(x => { if (LITE_SWAP[x.video]) { x.photo = LITE_SWAP[x.video]; x.video = null; } });
    return list;
  };

  const KEY = LITE ? '4patitas:movil1' : '4patitas:v1'; // clave propia: Huellas usa 'huellas:*' en el mismo dominio
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

  const state = Vue.reactive(saved && saved.reports ? saved : {
    reports: lite(seedReports()), pets: lite(seedPets()), user: { name: '', zone: '' },
  });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn('No se pudo guardar', e); } };
  Vue.watch(state, save, { deep: true });

  const reset = () => { Object.assign(state, { reports: lite(seedReports()), pets: lite(seedPets()) }); };

  // Distancia en km (haversine)
  const km = (a, b) => {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  // Coincidencias: misma especie, tipo opuesto (perdido ↔ visto/encontrado), < 5 km
  const matches = rep => state.reports
    .filter(o => o.id !== rep.id && o.species === rep.species && o.type !== 'reunido' &&
      ((rep.type === 'perdido') !== (o.type === 'perdido')))
    .map(o => {
      const d = km(rep, o);
      const colorHit = rep.color && o.color && rep.color.toLowerCase().split(/\s+/)[0] === o.color.toLowerCase().split(/\s+/)[0];
      const breedHit = rep.breed && o.breed && rep.breed.toLowerCase() === o.breed.toLowerCase();
      return { r: o, d, score: Math.round(Math.max(0, 60 - d * 10) + (colorHit ? 25 : 0) + (breedHit ? 15 : 0)) };
    })
    .filter(m => m.d < 5 && m.score >= 40)
    .sort((a, b) => b.score - a.score);

  const timeAgo = t => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return `hace ${Math.max(1, m)} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `hace ${h} h`;
    const d = Math.round(h / 24);
    return `hace ${d} día${d > 1 ? 's' : ''}`;
  };

  return { CENTER, ZONES, TYPES, SPECIES, ACCENTS, accentOf, state, reset, km, matches, timeAgo, M, LITE, lite };
})();

<script>
/* 4 PATITAS — acciones de datos. Modo local (localStorage) o en línea (Supabase + tiempo real).
   Toda la app escribe a través de HUELLAS.actions; así el mismo código sirve en ambos modos.
   Sesión: anónima por defecto; "Continuar con Google" convierte esa sesión en una cuenta
   (linkIdentity), así lo publicado antes sigue siendo tuyo. */
(() => {
  const H = window.HUELLAS, { state } = H;
  const cfg = window.HUELLAS_CONFIG || {};
  const sb = cfg.supabaseUrl && cfg.supabaseKey && window.supabase
    ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, flowType: 'pkce', detectSessionInUrl: true } })
    : null;

  const status = Vue.reactive({ online: false, connecting: !!sb, uid: null, user: null, authBusy: false, hasAuthor: false, googleReady: null, emailReady: null, autoconfirm: null, recovery: false });
  const notify = msg => H.onError && H.onError(msg);
  const liked = new Set(state.user.liked || []);
  const followed = new Set(state.user.followed || []);
  const remember = () => { state.user.liked = [...liked]; state.user.followed = [...followed]; };
  // La web abierta como archivo (file://, content:// de WhatsApp) no puede recibir la vuelta de Google
  const hosted = /^https?:$/.test(location.protocol);
  const redirectTo = () => location.origin + location.pathname;

  // ---------- conversión fila de la base ↔ objeto de la app ----------
  const toReport = row => H.lite([{
    id: row.id, type: row.type, species: row.species, name: row.name, breed: row.breed || '', color: row.color || '',
    zone: row.zone || '', lat: row.lat, lng: row.lng, desc: row.description || '', reward: row.reward || '',
    contact: row.contact || '', photo: row.photo, video: row.video, petId: row.pet_id, likes: row.likes,
    date: Date.parse(row.created_at), comments: [], liked: liked.has(row.id),
    ownerId: row.user_id, mine: !!status.uid && row.user_id === status.uid, author: row.author || '', avatar: row.avatar || '',
  }])[0];
  const toPet = row => H.lite([{
    id: row.id, name: row.name, species: row.species, breed: row.breed || '', age: row.age || '', owner: row.owner || '',
    zone: row.zone || '', bio: row.bio || '', traits: row.traits || [], photo: row.photo, video: row.video,
    accent: row.accent || '#EEDDB9', followers: row.followers, lost: row.lost,
    ownerId: row.user_id, mine: !!status.uid && row.user_id === status.uid, author: row.author || '', avatar: row.avatar || '',
  }])[0];
  const toComment = row => ({ id: row.id, text: row.text, date: Date.parse(row.created_at), author: row.author || '', avatar: row.avatar || '' });
  // Nombre y foto de Google para guardar junto a lo publicado (solo si la base ya tiene esas columnas)
  const byline = () => (status.hasAuthor && status.user ? { author: status.user.name, avatar: status.user.avatar || null } : {});

  const digits = c => { const d = String(c || '').replace(/\D/g, ''); return d.startsWith('591') ? d : '591' + d; };

  // Sube una foto (data URL comprimida por la app) a Storage y devuelve su URL pública
  async function uploadPhoto(dataUrl) {
    if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl || null;
    const blob = await (await fetch(dataUrl)).blob();
    const path = `${status.uid}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
    const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  }

  // ---------- sesión ----------
  function setSession(session) {
    const u = session && session.user;
    status.uid = u ? u.id : null;
    if (u && !u.is_anonymous) {
      const m = u.user_metadata || {};
      status.user = { name: m.full_name || m.name || (u.email || '').split('@')[0], email: u.email || '', avatar: m.avatar_url || m.picture || '' };
      if (!state.user.name) state.user.name = status.user.name;
    } else status.user = null;
    // recalcula qué publicaciones son de esta persona
    state.reports.forEach(r => { if (r.ownerId !== undefined) r.mine = !!status.uid && r.ownerId === status.uid; });
    state.pets.forEach(p => { if (p.ownerId !== undefined) p.mine = !!status.uid && p.ownerId === status.uid; });
  }

  // Vuelta de Google: limpia ?code= / ?error= de la dirección y avisa si algo falló
  function handleReturn() {
    const q = new URLSearchParams(location.search);
    const hq = new URLSearchParams((location.hash.split('?')[1]) || '');
    const code = q.get('error_code') || hq.get('error_code');
    const desc = q.get('error_description') || hq.get('error_description');
    if (q.has('code') || code || q.has('error')) {
      try {
        history.replaceState(null, '', location.pathname + (location.hash.startsWith('#/') ? location.hash.split('?')[0] : '#/cuenta'));
        dispatchEvent(new HashChangeEvent('hashchange')); // el router muestra "Mi cuenta"
      } catch (e) {}
    }
    if (code === 'identity_already_exists') {
      // esa cuenta de Google ya existe: entra directamente con ella
      sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectTo() } });
      return true;
    }
    if (code || desc) notify('No se pudo iniciar sesión: ' + (desc || code).replace(/\+/g, ' '));
    return false;
  }

  async function loginGoogle() {
    if (!sb || !status.online) return notify('El inicio de sesión necesita conexión a internet');
    if (!hosted) { location.href = (cfg.siteUrl || '') + '#/cuenta'; return; }
    if (status.googleReady === false) return notify('El inicio con Google todavía no está activado en 4 Patitas');
    status.authBusy = true;
    const { data: { session } } = await sb.auth.getSession();
    const opts = { provider: 'google', options: { redirectTo: redirectTo() } };
    // con una sesión anónima se vincula Google a ella para conservar lo publicado
    const res = session && session.user.is_anonymous && sb.auth.linkIdentity
      ? await sb.auth.linkIdentity(opts)
      : await sb.auth.signInWithOAuth(opts);
    if (res.error) {
      // p. ej. vinculación manual desactivada: entrar normalmente con Google
      const again = await sb.auth.signInWithOAuth(opts);
      if (again.error) { status.authBusy = false; notify('No se pudo abrir Google: ' + again.error.message); }
    }
  }

  // ---------- correo y contraseña ----------
  const ES = [
    [/invalid login credentials/i, 'Correo o contraseña incorrectos.'],
    [/already (been )?registered|already exists|email_exists/i, 'Ese correo ya tiene cuenta. Entra con tu contraseña.'],
    [/at least 6|weak_password|password should/i, 'La contraseña debe tener al menos 6 caracteres.'],
    [/not confirmed/i, 'Confirma tu correo con el enlace que te enviamos y vuelve a intentar.'],
    [/rate limit|too many|over_email_send/i, 'Demasiados intentos. Espera unos minutos y prueba de nuevo.'],
    [/invalid.*email|unable to validate email/i, 'Ese correo no parece válido.'],
    [/signups? not allowed|signup.*disabled/i, 'El registro con correo está desactivado en 4 Patitas.'],
    [/fetch|network/i, 'Sin conexión. Revisa tu internet.'],
  ];
  const es = e => { const m = (e && (e.code || '') + ' ' + (e.message || '')) || ''; const hit = ES.find(([rx]) => rx.test(m)); return hit ? hit[1] : (e && e.message) || 'Algo salió mal. Inténtalo de nuevo.'; };
  const ready = () => { if (!sb || !status.online) throw new Error('Sin conexión. Revisa tu internet.'); };

  // Crear cuenta: si hay sesión anónima, se le agrega correo y contraseña (lo publicado sigue siendo tuyo)
  async function signUp({ name, email, password }) {
    ready(); status.authBusy = true;
    try {
      const data = { full_name: name.trim() };
      const { data: { session } } = await sb.auth.getSession();
      let res;
      if (session && session.user.is_anonymous) {
        res = await sb.auth.updateUser({ email: email.trim(), password, data });
        if (res.error) throw res.error;
        // con "Confirm email" activado, el correo queda pendiente hasta que se confirme
        if (res.data.user && res.data.user.is_anonymous) return { pending: true };
      } else {
        res = await sb.auth.signUp({ email: email.trim(), password, options: { data, emailRedirectTo: cfg.siteUrl || redirectTo() } });
        if (res.error) throw res.error;
        if (!res.data.session) return { pending: true };
      }
      const s = (await sb.auth.getSession()).data.session;
      setSession(s);
      return { ok: true };
    } catch (e) { throw new Error(es(e)); }
    finally { status.authBusy = false; }
  }

  async function signIn({ email, password }) {
    ready(); status.authBusy = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
      setSession(data.session);
      return { ok: true };
    } catch (e) { throw new Error(es(e)); }
    finally { status.authBusy = false; }
  }

  async function resetPassword(email) {
    ready(); status.authBusy = true;
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: cfg.siteUrl || redirectTo() });
      if (error) throw error;
      return { ok: true };
    } catch (e) { throw new Error(es(e)); }
    finally { status.authBusy = false; }
  }

  async function setNewPassword(password) {
    ready(); status.authBusy = true;
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      status.recovery = false;
      return { ok: true };
    } catch (e) { throw new Error(es(e)); }
    finally { status.authBusy = false; }
  }

  async function logout() {
    if (!sb) return;
    status.authBusy = true;
    await sb.auth.signOut();
    const res = await sb.auth.signInAnonymously();
    setSession(res.data && res.data.session);
    status.authBusy = false;
    notify('Cerraste sesión');
  }

  // ---------- carga inicial + tiempo real ----------
  async function connect() {
    try {
      // getSession espera a que supabase-js canjee el ?code= de Google; recién después se limpia la dirección
      let { data: { session } } = await sb.auth.getSession();
      if (handleReturn()) return;
      if (!session) {
        const res = await sb.auth.signInAnonymously();
        if (res.error) throw res.error;
        session = res.data.session;
      }
      setSession(session);
      // ¿Está activado el proveedor Google en Supabase? (Authentication → Sign In / Providers)
      fetch(cfg.supabaseUrl + '/auth/v1/settings', { headers: { apikey: cfg.supabaseKey } })
        .then(r => r.json()).then(s => {
          status.googleReady = !!(s.external && s.external.google);
          status.emailReady = !(s.external && s.external.email === false) && !s.disable_signup;
          status.autoconfirm = !!s.mailer_autoconfirm; // true = "Confirm email" desactivado
        })
        .catch(() => { status.googleReady = false; });
      sb.auth.onAuthStateChange((event, s) => {
        if (s) setSession(s);
        if (event === 'PASSWORD_RECOVERY') { status.recovery = true; location.hash = '#/cuenta'; }
        if (event === 'SIGNED_IN' && s && !s.user.is_anonymous && status.user) notify('👋 ¡Hola, ' + status.user.name + '!');
      });

      const [reports, pets, comments] = await Promise.all([
        sb.from('reports').select('*').order('created_at', { ascending: false }).limit(500),
        sb.from('pets').select('*').order('created_at', { ascending: true }).limit(500),
        sb.from('comments').select('*').order('created_at', { ascending: true }).limit(3000),
      ]);
      const err = reports.error || pets.error || comments.error;
      if (err) throw err;
      status.hasAuthor = !!(reports.data[0] && 'author' in reports.data[0]);

      const list = reports.data.map(toReport);
      const byId = Object.fromEntries(list.map(r => [r.id, r]));
      comments.data.forEach(c => byId[c.report_id] && byId[c.report_id].comments.push(toComment(c)));
      state.reports = list;
      state.pets = pets.data.map(toPet);
      status.online = true;
      subscribe();
    } catch (e) {
      console.warn('4 Patitas sin conexión a la base de datos:', e);
      notify('Sin conexión con la comunidad: mostrando datos guardados en este equipo');
    } finally {
      status.connecting = false;
      status.authBusy = false;
    }
  }

  function subscribe() {
    sb.channel('huellas')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, ({ eventType, new: row, old }) => {
        const i = state.reports.findIndex(r => r.id === (row && row.id) || r.id === (old && old.id));
        if (eventType === 'DELETE') { if (i > -1) state.reports.splice(i, 1); return; }
        const r = toReport(row);
        if (i > -1) Object.assign(state.reports[i], { ...r, comments: state.reports[i].comments, liked: state.reports[i].liked });
        else state.reports.unshift(r);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pets' }, ({ eventType, new: row, old }) => {
        const i = state.pets.findIndex(p => p.id === (row && row.id) || p.id === (old && old.id));
        if (eventType === 'DELETE') { if (i > -1) state.pets.splice(i, 1); return; }
        if (i > -1) Object.assign(state.pets[i], toPet(row)); else state.pets.unshift(toPet(row));
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, ({ new: row }) => {
        const r = state.reports.find(x => x.id === row.report_id);
        if (r && !r.comments.some(c => c.id === row.id)) r.comments.push(toComment(row));
      })
      .subscribe();
  }

  // ---------- acciones ----------
  const local = {
    async addReport(form) {
      const id = 'r' + Date.now();
      state.reports.unshift({ ...form, id, contact: digits(form.contact), date: Date.now(), likes: 0, liked: false, comments: [], mine: true });
      if (form.petId) { const p = state.pets.find(x => x.id === form.petId); if (p) p.lost = true; }
      return id;
    },
    async addPet(form) {
      const id = 'p' + Date.now();
      state.pets.unshift({ ...form, id, followers: 0, mine: true });
      return id;
    },
    async toggleLike(r) { r.liked = !r.liked; r.likes += r.liked ? 1 : -1; r.liked ? liked.add(r.id) : liked.delete(r.id); remember(); },
    async toggleFollow(p) { const on = !followed.has(p.id); on ? followed.add(p.id) : followed.delete(p.id); p.followers += on ? 1 : -1; remember(); return on; },
    async addComment(r, text) { r.comments.push({ id: Date.now(), text, date: Date.now(), author: state.user.name || '' }); },
    async setReportType(r, type) { r.type = type; },
    async setPetLost(p, lost) { p.lost = lost; },
    async removeReport(id) { const i = state.reports.findIndex(x => x.id === id); if (i > -1) state.reports.splice(i, 1); },
  };

  const remote = {
    async addReport(form) {
      const photo = await uploadPhoto(form.photo);
      const { data, error } = await sb.from('reports').insert({
        type: form.type, species: form.species, name: form.name.trim(), breed: form.breed, color: form.color, zone: form.zone,
        lat: form.lat, lng: form.lng, description: form.desc, reward: form.type === 'perdido' ? form.reward : null,
        contact: digits(form.contact), photo, video: form.video || null, pet_id: form.petId || null, ...byline(),
      }).select().single();
      if (error) throw error;
      if (!state.reports.some(r => r.id === data.id)) state.reports.unshift(toReport(data));
      if (form.petId) { const p = state.pets.find(x => x.id === form.petId); if (p && p.mine) await remote.setPetLost(p, true); }
      return data.id;
    },
    async addPet(form) {
      const photo = await uploadPhoto(form.photo);
      const { data, error } = await sb.from('pets').insert({
        name: form.name.trim(), species: form.species, breed: form.breed, age: form.age, owner: form.owner, zone: form.zone,
        bio: form.bio, traits: form.traits, photo, accent: form.accent, ...byline(),
      }).select().single();
      if (error) throw error;
      if (!state.pets.some(p => p.id === data.id)) state.pets.unshift(toPet(data));
      return data.id;
    },
    async toggleLike(r) {
      await local.toggleLike(r);
      const { data, error } = await sb.rpc('like_report', { rid: r.id, delta: r.liked ? 1 : -1 });
      if (!error && typeof data === 'number') r.likes = data;
    },
    async toggleFollow(p) {
      const on = await local.toggleFollow(p);
      const { data, error } = await sb.rpc('follow_pet', { pid: p.id, delta: on ? 1 : -1 });
      if (!error && typeof data === 'number') p.followers = data;
      return on;
    },
    async addComment(r, text) {

  };

  Object.assign(H, { actions, status, canEdit, auth });
  if (sb) connect();
})();

const ROUTES = [
  ['/', 'page-home'], ['/mapa', 'page-map'], ['/publicar', 'page-publish'],
  ['/comunidad', 'page-community'], ['/registrar', 'page-register'], ['/mascota/:id', 'page-pet'], ['/cuenta', 'page-account'],
];
const parse = (hash = location.hash) => {
  const [path, qs = ''] = (hash.replace(/^#/, '') || '/').split('?');
  const query = Object.fromEntries(new URLSearchParams(qs));
  for (const [pattern, comp] of ROUTES) {
    const keys = [], rx = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => (keys.push(k), '([^/]+)')) + '/?$');
    const m = path.match(rx);
    if (m) return { path, comp, query, params: Object.fromEntries(keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };
  }
  return { path: '/', comp: 'page-home', query, params: {} };
};
const route = ref(parse());
addEventListener('hashchange', () => { route.value = parse(); });
// Navegación en memoria: funciona igual dentro de un iframe/visor compartido que como sitio normal
const go = p => {
  route.value = parse('#' + p);

const readImage = (file, max = 900) => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    res(c.toDataURL('image/jpeg', 0.78));
  };
  img.onerror = rej;
  img.src = URL.createObjectURL(file);
});

  const from = {}, to = { clearProps: 'opacity,transform,translate,rotate,scale' };
  for (const k in vars) (FROM_KEYS.includes(k) ? from : to)[k] = vars[k];
  for (const k in from) to[k] = k === 'opacity' || k === 'scale' ? 1 : 0;

};

};

// Mapa vectorial propio de Santa Cruz (anillos, radiales, río Piraí, barrios) si las teselas no cargan.

const offset = ([lat, lng], m, deg) => {
  const r = deg * Math.PI / 180;
  return [lat + (m * Math.cos(r)) / 111320, lng + (m * Math.sin(r)) / (111320 * Math.cos(lat * Math.PI / 180))];
};

  const ink = cssVar('--ink'), soft = cssVar('--line-2');

    if (labels) L.marker(offset(CENTER, m, 0), { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="ring-label">${name} anillo</div>` }) }).addTo(map);
  });

  L.circleMarker(CENTER, { radius: 6, color: ink, fillColor: cssVar('--yellow'), fillOpacity: 1, weight: 1.75, interactive: false }).addTo(map);

}
const makeMap = (el, opts = {}) => {
  const map = L.map(el, { zoomControl: false, attributionControl: true, ...opts }).setView(opts.center || CENTER, opts.zoom || 13);

app.component('page-map', {
  setup() {
    const root = ref(null), el = ref(null);
    const f = reactive({ type: 'todos', species: 'todas', q: '' });
    const sel = ref(route.value.query.focus || null);
    const list = computed(() => state.reports
      .filter(r => (f.type === 'todos' || r.type === f.type) && (f.species === 'todas' || r.species === f.species))
      .filter(r => !f.q || `${r.name} ${r.breed} ${r.zone} ${r.color}`.toLowerCase().includes(f.q.toLowerCase()))
      .sort((a, b) => b.date - a.date));
    let map, layer, temp;
    const markers = {};

    const draw = () => {
      layer.clearLayers();
      list.value.forEach(r => {
        const m = L.marker([r.lat, r.lng], { icon: pinIcon(r) })
          .bindPopup(`<div class="pop"><h4>${esc(r.name)}</h4><p>${TYPES[r.type].label} · ${esc(r.zone)} · ${timeAgo(r.date)}</p><button data-open="${r.id}">Ver detalles</button></div>`)
          .on('click', () => (sel.value = r.id));
        markers[r.id] = m; layer.addLayer(m);
      });
    };
    const focus = id => {
      const r = state.reports.find(x => x.id === id); if (!r) return;
      sel.value = id;
      map.flyTo([r.lat, r.lng], 16, { duration: 1.1 });
      setTimeout(() => markers[id] && markers[id].openPopup(), 1150);
    };
    const locate = () => {
      if (!navigator.geolocation) return toast('Tu navegador no permite ubicación');
      navigator.geolocation.getCurrentPosition(p => {
        const ll = [p.coords.latitude, p.coords.longitude];
        L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }) }).addTo(map);
        map.flyTo(ll, 15);
        const near = state.reports.filter(r => r.type !== 'reunido' && km({ lat: ll[0], lng: ll[1] }, r) < 5).length;
        toast(`${near} alertas a menos de 5 km de ti`);
      }, () => toast('No pudimos obtener tu ubicación'));
    };

    usePageFx(root, () => {
      intro('.mapside > *', { x: -24, opacity: 0, stagger: .06, duration: .8, ease: 'power3.out', delay: .2 });
      intro('.map', { opacity: 0, duration: 1, ease: 'power3.out', delay: .1 });
    });

    onMounted(() => {
      map = makeMap(el.value, { zoom: 13 });
      layer = L.layerGroup().addTo(map);
      draw();
      map.on('click', e => {
        temp && temp.remove();
        const { lat, lng } = e.latlng;
        temp = L.popup().setLatLng(e.latlng).setContent(`<div class="pop"><h4>¿Reportar aquí?</h4><p>Marca este punto para una mascota perdida o vista.</p><button data-here="${lat.toFixed(5)},${lng.toFixed(5)}">Reportar en este lugar</button></div>`).openOn(map);
      });
      // los popups de Leaflet cortan la propagación del click, así que escuchamos en fase de captura
      document.addEventListener('click', onPopupClick, true);
      setTimeout(() => { map.invalidateSize(); if (sel.value) focus(sel.value); }, 700);
    });
    const onPopupClick = e => {
      const o = e.target.closest('[data-open]'); if (o) openAlert(o.dataset.open);
      const h = e.target.closest('[data-here]'); if (h) { const [lat, lng] = h.dataset.here.split(','); go(`/publicar?lat=${lat}&lng=${lng}`); }
    };
    watch(list, draw);
    onBeforeUnmount(() => { document.removeEventListener('click', onPopupClick, true); map && map.remove(); });

    return { root, el, f, list, sel, focus, locate, TYPES, SPECIES, timeAgo, status };
  },
  template: `
  <main class="page" ref="root" style="padding-bottom:30px">
    <div class="wrap">
      <div class="mapwrap">
        <aside class="mapside">
          <div><span class="eyebrow">mapa en vivo<template v-if="status.online"> · <span class="live-dot"></span>conectado</template></span><h1 class="h-md" style="margin-top:6px">Santa Cruz de la Sierra</h1></div>
          <label class="sr" for="q" style="position:absolute;left:-9999px">Buscar</label>
          <input id="q" class="input" v-model="f.q" placeholder="Buscar por nombre, raza, barrio o color">
          <div class="filters">
            <button class="chip" :class="{on:f.type==='todos'}" @click="f.type='todos'">Todos</button>
            <button v-for="(t,k) in TYPES" :key="k" class="chip" :class="{on:f.type===k}" @click="f.type=k"><ico :name="t.icon" />{{ t.label }}</button>
          </div>
          <div class="filters">
            <button class="chip" :class="{on:f.species==='todas'}" @click="f.species='todas'">Todas</button>
            <button v-for="(icon,k) in SPECIES" :key="k" class="chip" :class="{on:f.species===k}" @click="f.species=k" :aria-label="k" :title="k"><ico :name="icon" /></button>
          </div>
          <div class="mapside__list" data-lenis-prevent>
            <button v-for="r in list" :key="r.id" class="alert-item" :class="{on:sel===r.id}" @click="focus(r.id)" @dblclick="openAlert(r.id)">
              <div class="thumb" :style="{'--c':TYPES[r.type].color}"><pet-media :item="r" /></div>
              <div style="min-width:0">
                <h4>{{ r.name }}</h4>
                <p>{{ r.breed }} · {{ r.zone }} · {{ timeAgo(r.date) }}</p>
                <div style="margin-top:6px"><type-tag :type="r.type" /></div>
              </div>
            </button>
            <p v-if="!list.length" class="empty">No hay alertas con esos filtros.</p>
          </div>
          <a href="#/publicar" class="btn btn--alert"><ico name="megaphone" />Publicar una alerta</a>
        </aside>
        <div class="map" ref="el" data-lenis-prevent>
          <div class="map__hint"><ico name="hand" />Toca el mapa para reportar en ese punto</div>
          <div class="map__tools"><button class="btn btn--sm" @click.stop="locate"><ico name="locate" />Cerca de mí</button></div>
        </div>
      </div>
    </div>
  </main>`,
});

app.component('page-publish', {
  setup() {
    const root = ref(null), pick = ref(null), fileIn = ref(null);
    const q = route.value.query;
    const hasPoint = !!(q.lat && q.lng);
    const form = reactive({ type: 'perdido', species: 'perro', name: '', breed: '', color: '', zone: 'Centro', desc: '', reward: '', contact: '', photo: null,
      lat: hasPoint ? +q.lat : CENTER[0], lng: hasPoint ? +q.lng : CENTER[1] });
    // si viene desde el perfil de una mascota, precargamos sus datos
    if (q.pet) {
      const p = state.pets.find(x => x.id === q.pet);
      if (p) Object.assign(form, { name: p.name, species: p.species, breed: p.breed, zone: p.zone, desc: p.bio, photo: p.photo || null, video: p.video, petId: p.id, lat: ZONES[p.zone][0], lng: ZONES[p.zone][1] });
    }
    let map, marker;
    const types = { perdido: ['megaphone', 'Perdí a mi mascota'], visto: ['eye', 'Vi una mascota'], encontrado: ['home', 'La rescaté'] };

    const onFile = async e => {
      const file = e.target.files[0]; if (!file) return;
      form.photo = await readImage(file); form.video = null;
    };
    watch(() => form.zone, z => {
      if (!map) return;
      form.lat = ZONES[z][0]; form.lng = ZONES[z][1];
      marker.setLatLng(ZONES[z]); map.flyTo(ZONES[z], 15, { duration: .8 });
    });
    const valid = computed(() => form.name.trim() && form.contact.replace(/\D/g, '').length >= 7);
    const sending = ref(false);
    const submit = async () => {
      if (!valid.value) return toast('Completa el nombre y un WhatsApp válido');
      if (sending.value) return;
      sending.value = true;
      try {
        const id = await actions.addReport({ ...form });
        toast('Alerta publicada. Ya está en el mapa');
        go('/mapa?focus=' + id);
        setTimeout(() => openAlert(id), 1700);
      } catch (e) {
        toast('No se pudo publicar: ' + (e.message || 'revisa tu conexión e inténtalo de nuevo'));
      } finally { sending.value = false; }
    };

    usePageFx(root, () => {
      intro('.page__head > *', { y: 24, opacity: 0, stagger: .07, duration: .9, ease: 'power3.out', delay: .15 });
      intro('.publish-layout > *', { y: 30, opacity: 0, stagger: .1, duration: .9, ease: 'power3.out', delay: .3 });
    });
    onMounted(() => {
      map = makeMap(pick.value, { center: [form.lat, form.lng], zoom: hasPoint ? 16 : 14 });
      marker = L.marker([form.lat, form.lng], { draggable: true, icon: pinIcon(form) }).addTo(map);
      const set = ll => { form.lat = ll.lat; form.lng = ll.lng; marker.setLatLng(ll); };
      marker.on('dragend', () => set(marker.getLatLng()));
      map.on('click', e => set(e.latlng));
      watch(() => [form.type, form.species], () => marker.setIcon(pinIcon(form)));
      setTimeout(() => map.invalidateSize(), 700);
    });
    onBeforeUnmount(() => map && map.remove());

    return { root, pick, fileIn, form, types, SPECIES, ZONES, TYPES, onFile, submit, valid, hasPoint, sending };
  },

/* Formulario de cuenta con correo y contraseña: crear cuenta / entrar / recuperar / nueva contraseña */
app.component('email-auth', {
  setup() {
    const mode = ref(status.recovery ? 'nueva' : 'crear'); // crear | entrar | olvido | nueva
    const f = reactive({ name: state.user.name || '', email: '', password: '' });
    const show = ref(false), msg = ref(''), ok = ref('');
    watch(() => status.recovery, v => { if (v) mode.value = 'nueva'; });
    watch(mode, () => { msg.value = ''; ok.value = ''; });
    const valid = computed(() => {
      const mail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim());
      if (mode.value === 'olvido') return mail;
      if (mode.value === 'nueva') return f.password.length >= 6;
      if (mode.value === 'crear') return mail && f.password.length >= 6 && f.name.trim().length >= 2;
      return mail && f.password.length >= 1;
    });
    const submit = async () => {
      msg.value = ''; ok.value = '';
      if (!valid.value) {
        msg.value = mode.value === 'crear' ? 'Escribe tu nombre, un correo válido y una contraseña de 6 caracteres o más.' : 'Revisa el correo y la contraseña.';
        return;
      }
      try {
        if (mode.value === 'crear') {
          const r = await auth.signUp(f);
          if (r.pending) ok.value = `Te enviamos un enlace a ${f.email}. Ábrelo para activar tu cuenta.`;
          else toast('Cuenta creada. Bienvenido a la manada');
        } else if (mode.value === 'entrar') {
          await auth.signIn(f);
        } else if (mode.value === 'olvido') {
          await auth.resetPassword(f.email);
          ok.value = `Si ${f.email} tiene cuenta, te llegará un enlace para crear una contraseña nueva.`;
        } else {
          await auth.setNewPassword(f.password);
          toast('Contraseña actualizada');
        }
        f.password = '';
      } catch (e) { msg.value = e.message; }
    };
    const titles = { crear: 'Crear cuenta', entrar: 'Entrar', olvido: 'Enviar enlace', nueva: 'Guardar contraseña' };
    return { mode, f, show, msg, ok, submit, status, titles };
  },
  template: `
    <form class="eauth" @submit.prevent="submit" novalidate>
      <div v-if="mode==='crear' || mode==='entrar'" class="eauth__tabs" role="tablist">
        <button type="button" role="tab" :aria-selected="mode==='crear'" :class="{on:mode==='crear'}" @click="mode='crear'">Crear cuenta</button>
        <button type="button" role="tab" :aria-selected="mode==='entrar'" :class="{on:mode==='entrar'}" @click="mode='entrar'">Ya tengo cuenta</button>
      </div>
      <p v-if="mode==='olvido'" class="eauth__hint">Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.</p>
      <p v-if="mode==='nueva'" class="eauth__hint">Elige tu contraseña nueva.</p>

      <div class="field" v-if="mode==='crear'">
        <label for="ea-name">Tu nombre</label>
        <input id="ea-name" class="input" v-model="f.name" autocomplete="name" placeholder="Ej. Valeria Rojas" maxlength="60">
      </div>
      <div class="field" v-if="mode!=='nueva'">
        <label for="ea-email">Correo</label>
        <input id="ea-email" class="input" v-model="f.email" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@gmail.com">
      </div>
      <div class="field" v-if="mode!=='olvido'">
        <label for="ea-pass">{{ mode==='nueva' ? 'Contraseña nueva' : 'Contraseña' }}</label>
        <div class="eauth__pass">
          <input id="ea-pass" class="input" v-model="f.password" :type="show ? 'text' : 'password'" :autocomplete="mode==='entrar' ? 'current-password' : 'new-password'" :placeholder="mode==='entrar' ? '' : 'Mínimo 6 caracteres'">
          <button type="button" class="eauth__eye" @click="show=!show" :aria-label="show ? 'Ocultar contraseña' : 'Mostrar contraseña'"><ico :name="show ? 'eyeOff' : 'eye'" /></button>
        </div>
      </div>

      <p v-if="msg" class="eauth__msg" role="alert">{{ msg }}</p>
      <p v-if="ok" class="eauth__ok" role="status">{{ ok }}</p>

      <button class="btn btn--primary eauth__go" :disabled="status.authBusy || status.connecting">{{ status.authBusy ? 'Un momento…' : titles[mode] }}</button>

      <button v-if="mode==='entrar'" type="button" class="eauth__link" @click="mode='olvido'">¿Olvidaste tu contraseña?</button>
      <button v-if="mode==='olvido'" type="button" class="eauth__link" @click="mode='entrar'">Volver a entrar</button>
    </form>`,
});

app.component('alert-modal', {
  props: ['id'],
  emits: ['close'],
  setup(props, { emit }) {
    const box = ref(null);
    const r = computed(() => state.reports.find(x => x.id === props.id));
    const m = computed(() => (r.value ? matches(r.value).slice(0, 3) : []));
    const comment = ref('');
    const send = async () => {
      const text = comment.value.trim(); if (!text) return;
      try { await actions.addComment(r.value, text); comment.value = ''; toast('Gracias por ayudar'); }
      catch (e) { toast('No se pudo enviar: ' + e.message); }
    };
    const reunite = async () => {
      try { await actions.setReportType(r.value, 'reunido'); toast('Reencuentro registrado'); }
      catch (e) { toast('No se pudo actualizar: ' + e.message); }
    };
    const confirmDel = ref(false);
    const remove = async () => {
      if (!confirmDel.value) { confirmDel.value = true; return; }
      try { await actions.removeReport(props.id); emit('close'); toast('Alerta eliminada'); }
      catch (e) { toast('No se pudo eliminar: ' + e.message); }
    };
    const close = () => gsap.to(box.value, { y: 24, opacity: 0, duration: .25, ease: 'power2.in', onComplete: () => emit('close') });
    const onKey = e => e.key === 'Escape' && close();
    onMounted(() => { addEventListener('keydown', onKey); intro(box.value, { y: 30, opacity: 0, duration: .6, ease: 'power3.out' }); });
    onBeforeUnmount(() => removeEventListener('keydown', onKey));
    const WORDS = { perro: 'PERRO', gato: 'GATO', ave: 'AVE', conejo: 'CONEJO', otro: 'MASCOTA' };
    const like = x => actions.toggleLike(x);
    return { box, r, m, comment, send, reunite, remove, confirmDel, canEdit, close, TYPES, timeAgo, waLink, openAlert, go, WORDS, like, share, BRAND };
  },
  template: `
    <div class="modal" v-if="r">
      <div class="modal__bg" @click="close"></div>
      <div class="modal__box" ref="box" data-lenis-prevent role="dialog" aria-modal="true" :aria-label="r.name">

          <p>{{ r.desc }}</p>
          <dl class="kv">
            <dt>Raza</dt><dd>{{ r.breed || '—' }}</dd>
            <dt>Color y señas</dt><dd>{{ r.color || '—' }}</dd>
            <dt>Lugar</dt><dd>{{ r.zone }}</dd>
            <template v-if="r.reward"><dt>Recompensa</dt><dd><b>{{ r.reward }}</b></dd></template>
            <template v-if="r.author"><dt>Publicó</dt><dd>{{ r.author }}</dd></template>
          </dl>
          <div v-if="m.length && r.type!=='reunido'">
            <p style="font-weight:800;margin-bottom:8px"><ico name="spark" /> Posibles coincidencias</p>
            <div class="match" v-for="x in m" :key="x.r.id" @click="openAlert(x.r.id)">

              <div style="flex:1;font-size:.88rem"><b>{{ x.score }}% de coincidencia</b> · {{ x.r.name }}<br><span class="muted">{{ TYPES[x.r.type].label }} a {{ x.d.toFixed(1) }} km · {{ timeAgo(x.r.date) }}</span></div>
            </div>
          </div>
          <div class="flex">
            <a v-if="r.type!=='reunido'" :href="waLink(r)" target="_blank" rel="noopener" class="btn btn--primary btn--sm"><ico name="whatsapp" />WhatsApp</a>
            <a :href="'#/mapa?focus='+r.id" class="btn btn--sm" @click="close"><ico name="map" />Mapa</a>
            <button class="like" :class="{on:r.liked}" @click="like(r)" :aria-pressed="r.liked" :aria-label="'Me gusta, ' + r.likes"><ico name="heart" />{{ r.likes }}</button>
